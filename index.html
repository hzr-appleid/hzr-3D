    body { background-color: #050811; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; position: relative; }
    
    /* 3D Canvas Container */
    #canvas-container { flex: 1; width: 100%; position: relative; z-index: 1; }
    
    /* شاشا بچووک یا کامێرایێ د گۆشەیێ سەر ل دەستێ چپێ دا */
    #camera-preview {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 110px;
      height: 85px;
      border: 2px solid #00ffcc;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      z-index: 10;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
    }
    #camera-preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

      background: #050811;

      align-items: center; 
      padding: 10px; 
      z-index: 10; 
    }
